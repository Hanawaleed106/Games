<!DOCTYPE html>
<html>
<head>

<title>Sudoku Game</title>

<style>

body{
    text-align:center;
    background-color:#f5f0e6;
    font-family:Arial;
}


h1{
    color:#5b3a29;
}


.board{

    width:450px;
    height:450px;
    margin:20px auto;

    display:grid;
    grid-template-columns:repeat(9,50px);

    border:3px solid black;
}



.cell{

    width:50px;
    height:50px;

    border:1px solid #777;

    font-size:25px;
    text-align:center;

}



.fixed{

    background-color:#ddd;
    font-weight:bold;

}



input{

    width:45px;
    height:45px;

    font-size:25px;
    text-align:center;

}



button{

    padding:10px 25px;

    font-size:18px;

    background-color:green;

    color:white;

    border:none;

    border-radius:5px;

    margin:10px;

}



#result{

    font-size:22px;

    color:#333;

}


</style>

</head>


<body>


<h1>🧩 Sudoku Game</h1>


<h2 id="result">Solve The Puzzle</h2>


<div class="board" id="board">


</div>



<button onclick="checkSudoku()">Check</button>

<button onclick="restart()">Restart</button>




<script>


let puzzle = [

5,3,"", "",7,"","","","",

6,"","",1,9,5,"","","",

"",9,8,"","","", "",6,"",

8,"","", "",6,"","","",3,

4,"","",8,"","3","","",1,

7,"","","",2,"","","",6,

"",6,"","","","",2,8,"",

 "","","4",1,9,"","","5",

 "","","","8","","","7",9

];



let solution = [

5,3,4,6,7,8,9,1,2,

6,7,2,1,9,5,3,4,8,

1,9,8,3,4,2,5,6,7,

8,5,9,7,6,1,4,2,3,

4,2,6,8,5,3,7,9,1,

7,1,3,9,2,4,8,5,6,

9,6,1,5,3,7,2,8,4,

2,8,7,4,1,9,6,3,5,

3,4,5,2,8,6,1,7,9

];



let board = document.getElementById("board");



function createBoard(){


    board.innerHTML="";


    for(let i=0;i<81;i++){


        if(puzzle[i]!=""){


            board.innerHTML += 
            `<input class="cell fixed" value="${puzzle[i]}" disabled>`;


        }

        else{


            board.innerHTML +=
            `<input class="cell" maxlength="1">`;

        }


    }


}



createBoard();





function checkSudoku(){


let cells=document.querySelectorAll(".cell");


let correct=true;


for(let i=0;i<81;i++){


    if(cells[i].value != solution[i]){

        correct=false;

    }

}



if(correct){

document.getElementById("result").innerHTML="🎉 Correct! You Win";

}

else{

document.getElementById("result").innerHTML="❌ Try Again";

}


}





function restart(){


createBoard();


document.getElementById("result").innerHTML="Solve The Puzzle";


}



</script>


</body>
</html>
